services:
  social-manager:
    build: .
    container_name: social-manager
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - social_manager_data:/app/data
      - social_manager_uploads:/app/uploads

volumes:
  social_manager_data:
  social_manager_uploads:
