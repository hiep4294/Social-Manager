name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check src/server.js
      - run: node --check src/meta-oauth.js
      - run: node --check src/security.js
      - run: node --check src/platforms/facebook.js
      - run: node --check src/platforms/instagram.js
      - run: node --check src/facebook-page-engagement.js
      - run: node --check src/page-auto-reply-worker.js
      - run: node --check src/facebook-operator-core.js
      - run: node --check src/facebook-operator-worker.js
      - run: node --check src/operator-command-poller.js
      - run: node --check src/group-monitor-core.js
      - run: node --check src/group-monitor-scheduler.js
      - run: node --check src/mcp-server.js
      - run: node --check src/github-bridge.js
      - run: node --check src/social-image.js
      - run: node --check src/runtime-auto-update.js
      - run: node --check scripts/start-demo.mjs
      - run: node --check scripts/start-codespace.mjs
      - run: node --check scripts/start-facebook-operator-agent.mjs
      - run: node --check scripts/operator-login.mjs
      - run: node --check scripts/smoke-test.mjs
      - run: node --check tests/facebook.test.mjs
      - run: node --check tests/facebook-engagement.test.mjs
      - run: node --check tests/facebook-operator-core.test.mjs
      - run: node --check tests/group-monitor-core.test.mjs
      - run: node --check tests/meta-oauth.test.mjs
      - run: node --check tests/mcp.test.mjs
      - run: node --check tests/github-bridge.test.mjs
      - run: node --check tests/social-image.test.mjs
      - run: node --check tests/runtime-auto-update.test.mjs
      - name: Check inline browser JavaScript syntax
        run: node -e "const fs=require('fs');const html=fs.readFileSync('public/index.html','utf8');const m=html.match(/<script>([\\s\\S]*)<\\/script>/);if(!m)throw new Error('Missing script');new Function(m[1]);"
      - name: Facebook adapter integration test
        run: npm run test:facebook
      - name: Facebook Page engagement test
        run: npm run test:engagement
      - name: Facebook operator core test
        run: npm run test:operator
      - name: Group Monitor core test
        run: npm run test:group-monitor
      - name: Meta OAuth integration test
        run: npm run test:meta
      - name: ChatGPT MCP integration test
        run: npm run test:mcp
      - name: GitHub bridge integration test
        run: npm run test:bridge
      - name: Generated social image test
        run: npm run test:image
      - name: Runtime auto update test
        run: npm run test:auto
      - name: End-to-end smoke test
        run: npm run test:smoke
