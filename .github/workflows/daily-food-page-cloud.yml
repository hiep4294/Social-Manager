name: Daily Food Page Cloud

on:
  schedule:
    - cron: '0 1 * * *' # 08:00 Asia/Ho_Chi_Minh
    - cron: '0 2 * * *' # 09:00 Asia/Ho_Chi_Minh
    - cron: '0 3 * * *' # 10:00 Asia/Ho_Chi_Minh
    - cron: '0 4 * * *' # 11:00 Asia/Ho_Chi_Minh
    - cron: '0 5 * * *' # 12:00 Asia/Ho_Chi_Minh
    - cron: '0 6 * * *' # 13:00 Asia/Ho_Chi_Minh
  workflow_dispatch:
    inputs:
      publish:
        description: 'Đăng thật lên Facebook'
        required: true
        type: boolean
        default: false
      date:
        description: 'Ngày YYYY-MM-DD, để trống = hôm nay giờ Việt Nam'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-food-page-cloud
  cancel-in-progress: false

jobs:
  daily-food:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FACEBOOK_PAGE_ID: '61594459680780'
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
      FOOD_DATE: ${{ inputs.date }}
      CLOUD_FOOD_PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish == true }}
      CLOUD_TRIGGER_CRON: ${{ github.event.schedule }}

    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          ref: stable

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate branded image and publish
        run: node scripts/cloud-food-daily.mjs

      - name: Persist recipe usage state
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "social-manager-bot"
          git config user.email "social-manager-bot@users.noreply.github.com"
          git add content/hom-nay-an-gi-recipe-state.json content/hom-nay-an-gi-recipe-state.csv
          if git diff --cached --quiet; then
            echo "No recipe state changes."
            exit 0
          fi
          git commit -m "Update Hôm Nay Ăn Gì recipe state"
          git pull --rebase origin stable
          git push origin HEAD:stable

      - name: Upload generated image and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-food-${{ github.run_id }}
          path: artifacts/cloud-food/
          if-no-files-found: warn
          retention-days: 30
