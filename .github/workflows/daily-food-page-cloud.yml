name: Daily Food Page Cloud

on:
  schedule:
    - cron: '0 1 * * *' # 08:00 Asia/Ho_Chi_Minh
    - cron: '0 2 * * *' # 09:00 Asia/Ho_Chi_Minh
    - cron: '0 3 * * *' # 10:00 Asia/Ho_Chi_Minh
    - cron: '0 4 * * *' # 11:00 Asia/Ho_Chi_Minh
    - cron: '0 5 * * *' # 12:00 Asia/Ho_Chi_Minh
    - cron: '0 6 * * *' # 13:00 Asia/Ho_Chi_Minh
  workflow_dispatch:
    inputs:
      publish:
        description: 'Đăng thật lên Facebook'
        required: true
        type: boolean
        default: false
      date:
        description: 'Ngày YYYY-MM-DD, để trống = hôm nay giờ Việt Nam'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-food-page-cloud
  cancel-in-progress: false

jobs:
  daily-food:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - page_id: '1358329424025816'
            page_name: 'Hôm Nay Ăn Gì?'
            page_slot: 5
            state_key: 'hom-nay-an-gi'
            hashtag: '#HomNayAnGi'
            brand_line_1: 'HÔM NAY'
            brand_line_2: 'ĂN GÌ?'
            brand_subtitle: 'MÓN NGON MỖI NGÀY'
            schedule_enabled: true
          - page_id: '1438142366038184'
            page_name: 'Món Ngon Mỗi Ngày'
            page_slot: 6
            state_key: 'mon-ngon-moi-ngay'
            hashtag: '#MonNgonMoiNgay'
            brand_line_1: 'MÓN NGON'
            brand_line_2: 'MỖI NGÀY'
            brand_subtitle: 'CÔNG THỨC DỄ LÀM'
            schedule_enabled: false
    env:
      FACEBOOK_PAGE_ID: ${{ matrix.page_id }}
      FOOD_PAGE_NAME: ${{ matrix.page_name }}
      FOOD_PAGE_SLOT: ${{ matrix.page_slot }}
      FOOD_STATE_KEY: ${{ matrix.state_key }}
      FOOD_PAGE_HASHTAG: ${{ matrix.hashtag }}
      FOOD_BRAND_LINE_1: ${{ matrix.brand_line_1 }}
      FOOD_BRAND_LINE_2: ${{ matrix.brand_line_2 }}
      FOOD_BRAND_SUBTITLE: ${{ matrix.brand_subtitle }}
      FOOD_SCHEDULE_ENABLED: ${{ matrix.schedule_enabled }}
      FOOD_IMAGE_PROVIDER: 'openai'
      FOOD_IMAGE_REQUIRED: 'true'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_IMAGE_MODEL: 'gpt-image-2.5-flare'
      OPENAI_IMAGE_SIZE: '1024x1024'
      OPENAI_IMAGE_QUALITY: 'high'
      META_ACCESS_TOKEN: ${{ secrets.FACEBOOK_SYSTEM_USER_ACCESS_TOKEN || secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
      FOOD_DATE: ${{ inputs.date }}
      CLOUD_FOOD_PUBLISH: ${{ (github.event_name == 'schedule' && matrix.schedule_enabled == true) || (github.event_name != 'schedule' && inputs.publish == true) }}
      CLOUD_TRIGGER_CRON: ${{ github.event.schedule }}

    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          ref: stable

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate branded image and publish
        run: node scripts/cloud-food-daily.mjs

      - name: Persist recipe usage state
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "social-manager-bot"
          git config user.email "social-manager-bot@users.noreply.github.com"

          STATE_JSON="content/${FOOD_STATE_KEY}-recipe-state.json"
          STATE_CSV="content/${FOOD_STATE_KEY}-recipe-state.csv"

          for file in "$STATE_JSON" "$STATE_CSV"; do
            if [ -e "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "No recipe state changes for ${FOOD_PAGE_NAME}."
            exit 0
          fi

          git commit -m "Update ${FOOD_PAGE_NAME} recipe state"
          git pull --rebase origin stable
          git push origin HEAD:stable

      - name: Upload generated image and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-food-${{ matrix.state_key }}-${{ github.run_id }}
          path: artifacts/cloud-food/${{ matrix.state_key }}/
          if-no-files-found: warn
          retention-days: 30
