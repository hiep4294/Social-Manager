name: Facebook Live Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/facebook-live-test.request'

jobs:
  live-facebook-post:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post one Facebook test message
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
        run: node scripts/facebook-live-test.mjs
