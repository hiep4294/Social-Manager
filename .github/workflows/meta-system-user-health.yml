name: Meta Access Health

on:
  workflow_dispatch:
    inputs:
      page_id:
        description: 'Facebook Page ID to verify'
        required: true
        type: string
        default: '1358329424025816'

permissions:
  contents: read

jobs:
  verify-meta-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      META_ACCESS_TOKEN: ${{ secrets.FACEBOOK_SYSTEM_USER_ACCESS_TOKEN || secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
      TARGET_PAGE_ID: ${{ inputs.page_id }}

    steps:
      - name: Verify token and Page access without publishing
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const sourceToken = String(process.env.META_ACCESS_TOKEN || '').trim();
          const version = String(process.env.META_GRAPH_VERSION || 'v26.0').trim();
          const pageId = String(process.env.TARGET_PAGE_ID || '').trim();

          if (!sourceToken) {
            console.error('META_SECRET_PRESENT=NO');
            process.exit(2);
          }
          if (!/^\d+$/.test(pageId)) {
            console.error('TARGET_PAGE_ID_VALID=NO');
            process.exit(2);
          }

          console.log('META_SECRET_PRESENT=YES');
          console.log('TOKEN_VALUE_PRINTED=NO');
          console.log(`TARGET_PAGE_ID=${pageId}`);

          async function graph(pathname, token = sourceToken) {
            const res = await fetch(`https://graph.facebook.com/${version}/${pathname}`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            const body = await res.json().catch(() => ({}));
            if (!res.ok || body?.error) {
              const e = new Error(body?.error?.message || `HTTP ${res.status}`);
              e.code = body?.error?.code ?? 'unknown';
              e.type = body?.error?.type ?? 'unknown';
              throw e;
            }
            return body;
          }

          let me;
          try {
            me = await graph('me?fields=id,name');
            console.log('TOKEN_VALID=YES');
            console.log(`TOKEN_ACTOR_ID=${me.id || ''}`);
            console.log(`TOKEN_ACTOR_NAME=${me.name || ''}`);
          } catch (e) {
            console.error('TOKEN_VALID=NO');
            console.error(`GRAPH_ERROR_CODE=${e.code}`);
            console.error(`GRAPH_ERROR_TYPE=${e.type}`);
            process.exit(3);
          }

          let pageToken = '';
          let tokenMode = '';

          if (String(me?.id || '') === pageId) {
            pageToken = sourceToken;
            tokenMode = 'PAGE';
          }

          if (!pageToken) {
            try {
              const target = await graph(`${pageId}?fields=id,name,access_token`);
              if (target?.access_token) {
                pageToken = String(target.access_token).trim();
                tokenMode = 'USER_TO_PAGE';
              }
            } catch {}
          }

          if (!pageToken) {
            try {
              const accounts = await graph('me/accounts?fields=id,name,access_token&limit=100');
              const target = (accounts.data || []).find(x => String(x?.id || '') === pageId);
              if (target?.access_token) {
                pageToken = String(target.access_token).trim();
                tokenMode = 'USER_TO_PAGE_LIST';
              }
            } catch {}
          }

          if (!pageToken) {
            try {
              const target = await graph(`${pageId}?fields=id,name`);
              if (String(target?.id || '') === pageId) {
                pageToken = sourceToken;
                tokenMode = 'SYSTEM_USER_DIRECT';
              }
            } catch {}
          }

          if (!pageToken) {
            console.error('PAGE_TOKEN_RESOLVED=NO');
            console.error('TARGET_PAGE_ACCESS=NO');
            process.exit(4);
          }

          console.log('PAGE_TOKEN_RESOLVED=YES');
          console.log(`META_TOKEN_MODE=${tokenMode}`);

          try {
            const page = await graph(`${pageId}?fields=id,name`, pageToken);
            console.log('TARGET_PAGE_ACCESS=YES');
            console.log(`PAGE_ID=${page.id || ''}`);
            console.log(`PAGE_NAME=${page.name || ''}`);
          } catch (e) {
            console.error('TARGET_PAGE_ACCESS=NO');
            console.error(`GRAPH_ERROR_CODE=${e.code}`);
            console.error(`GRAPH_ERROR_TYPE=${e.type}`);
            process.exit(5);
          }

          try {
            await graph(`${pageId}/posts?fields=id&limit=1`, pageToken);
            console.log('TARGET_PAGE_READ_POSTS=YES');
          } catch (e) {
            console.error('TARGET_PAGE_READ_POSTS=NO');
            console.error(`READ_POSTS_ERROR_CODE=${e.code}`);
            console.error(`READ_POSTS_ERROR_TYPE=${e.type}`);
            process.exit(6);
          }

          console.log('RESULT=META_PAGE_ACCESS_READY');
          NODE
